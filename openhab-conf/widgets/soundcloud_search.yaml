uid: soundcloud_search
tags:
  - soundcloud
  - music
props:
  parameters:
    - name: queryItem
      label: Search Query Item
      description: String Item linked to soundcloud:account:...:search#query
      type: TEXT
      required: true
      context: item
    - name: resultsItem
      label: Search Results Item
      description: String Item linked to soundcloud:account:...:search#results
      type: TEXT
      required: true
      context: item
    - name: trackIdItem
      label: Track ID Item
      description: String Item linked to soundcloud:account:...:player#track-id
      type: TEXT
      required: true
      context: item
    - name: titleItem
      label: Title Item
      type: TEXT
      required: false
      context: item
    - name: artistItem
      label: Artist Item
      type: TEXT
      required: false
      context: item
    - name: artworkItem
      label: Artwork URL Item
      type: TEXT
      required: false
      context: item
    - name: stateItem
      label: Playback State Item
      type: TEXT
      required: false
      context: item
timestamp: 2026-05-18T00:00:00Z
component: f7-block
config:
  style:
    padding: 0
slots:
  default:

    # ── Search ────────────────────────────────────────────────────────────────
    - component: f7-list
      config:
        inset: true
      slots:
        default:
          - component: oh-input-item
            config:
              item: "=props.queryItem"
              label: SoundCloud Suche
              placeholder: Künstler oder Titel...
              clearButton: true

    # ── Results ───────────────────────────────────────────────────────────────
    - component: f7-list
      config:
        mediaList: true
        inset: true
      slots:
        default:
          - component: oh-repeater
            config:
              for: track
              sourceType: expression
              expression: >-
                =(items[props.resultsItem] && items[props.resultsItem].state && items[props.resultsItem].state.startsWith('['))
                  ? JSON.parse(items[props.resultsItem].state)
                  : []
            slots:
              default:
                - component: f7-list-item
                  config:
                    title: "=loop.track.title"
                    subtitle: "=loop.track.artist"
                    after: "=(function(){ var d=loop.track.duration; return Math.floor(d/60)+':'+(d%60<10?'0':'')+(d%60); })()"
                    mediaItem: true
                    action: command
                    actionItem: "=props.trackIdItem"
                    actionCommand: "=String(loop.track.id)"
                  slots:
                    media:
                      - component: oh-image
                        config:
                          url: "=loop.track.artwork"
                          style:
                            width: 52px
                            height: 52px
                            borderRadius: 6px
                            objectFit: cover

    # ── Now playing + controls ────────────────────────────────────────────────
    - component: f7-list
      config:
        inset: true
      slots:
        default:
          - component: f7-list-item
            config:
              title: "=items[props.titleItem] ? items[props.titleItem].state : '—'"
              subtitle: "=items[props.artistItem] ? items[props.artistItem].state : '—'"
              mediaItem: true
            slots:
              media:
                - component: oh-image
                  config:
                    item: "=props.artworkItem"
                    style:
                      width: 44px
                      height: 44px
                      borderRadius: 4px
                      objectFit: cover
              after:
                - component: f7-row
                  config:
                    style:
                      gap: 6px
                  slots:
                    default:
                      - component: f7-button
                        config:
                          iconF7: play_fill
                          color: green
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: PLAY
                      - component: f7-button
                        config:
                          iconF7: pause_fill
                          color: orange
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: PAUSE
                      - component: f7-button
                        config:
                          iconF7: stop_fill
                          color: red
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: STOP
