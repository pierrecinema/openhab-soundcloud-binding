uid: soundcloud_search
tags:
  - soundcloud
  - music
props:
  parameters:
    - name: queryItem
      label: Search Query Item
      description: String Item linked to soundcloud:account:...:search#query
      type: TEXT
      required: true
      context: item
    - name: resultsItem
      label: Search Results Item
      description: String Item linked to soundcloud:account:...:search#results
      type: TEXT
      required: true
      context: item
    - name: trackIdItem
      label: Track ID Item
      description: String Item linked to soundcloud:account:...:player#track-id
      type: TEXT
      required: true
      context: item
    - name: streamUrlItem
      label: Stream URL Item
      description: String Item linked to soundcloud:account:...:player#stream-url
      type: TEXT
      required: false
      context: item
    - name: titleItem
      label: Title Item
      description: String Item linked to soundcloud:account:...:player#title
      type: TEXT
      required: false
      context: item
    - name: artistItem
      label: Artist Item
      description: String Item linked to soundcloud:account:...:player#artist
      type: TEXT
      required: false
      context: item
    - name: artworkItem
      label: Artwork URL Item
      description: String Item linked to soundcloud:account:...:player#artwork-url
      type: TEXT
      required: false
      context: item
    - name: stateItem
      label: Playback State Item
      description: String Item linked to soundcloud:account:...:player#playback-state
      type: TEXT
      required: false
      context: item
    - name: chromecastTag
      label: Chromecast Item Tag
      description: "Tag on your Chromecast playuri items (default: Chromecast)"
      type: TEXT
      required: false
    - name: chromecastTargetItem
      label: Chromecast Target Item
      description: String Item linked to soundcloud:account:...:player#chromecast-target (e.g. SC_CCTarget)
      type: TEXT
      required: false
      context: item
timestamp: 2026-05-19T00:00:00Z
component: f7-card
config:
  style:
    margin: 0
slots:
  default:

    # ── Orange Header ─────────────────────────────────────────────────────────
    - component: f7-card-header
      config:
        style:
          background: "#ff5500"
          color: white
          fontWeight: "700"
          fontSize: 18px
          padding: 12px 16px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: center
                gap: 10px
            slots:
              default:
                - component: f7-icon
                  config:
                    f7: music_note_2
                    size: 22
                    color: white
                - component: f7-block-title
                  config:
                    style:
                      color: white
                      fontSize: 18px
                      margin: 0
                    text: SoundCloud

    # ── Suchfeld ──────────────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 12px 16px 8px 16px
      slots:
        default:
          - component: oh-input
            config:
              item: "=props.queryItem"
              placeholder: Künstler oder Titel...
              clearButton: true
              sendButton: true
              style:
                border: "1px solid #ff5500"
                borderRadius: 20px
                padding: 6px 14px
                width: 100%
                boxSizing: border-box

    # ── Suchergebnisse ────────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 0
          minHeight: 300px
          maxHeight: 420px
          overflowY: auto
      slots:
        default:
          - component: f7-list
            config:
              noHairlines: true
              style:
                margin: 0
            slots:
              default:
                - component: oh-repeater
                  config:
                    for: track
                    fragment: true
                    sourceType: array
                    in: "=(@@props.resultsItem || '').startsWith('[') ? JSON.parse(@@props.resultsItem) : []"
                  slots:
                    default:
                      - component: oh-list-item
                        config:
                          title: "=loop.track.title"
                          subtitle: "=loop.track.artist"
                          action: command
                          actionItem: "=props.trackIdItem"
                          actionCommand: "=loop.track.id"

    # ── Aktueller Track ───────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          borderTop: "2px solid #ff5500"
          padding: 12px 16px 0 16px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: flex-start
                gap: 16px
            slots:
              default:
                # Cover-Art
                - component: f7-col
                  config:
                    style:
                      flex: "0 0 auto"
                  slots:
                    default:
                      - component: oh-image
                        config:
                          item: "=props.artworkItem"
                          style:
                            display: block
                            width: 320px
                            height: 320px
                            minWidth: 320px
                            minHeight: 320px
                            borderRadius: 12px
                            objectFit: cover
                            boxShadow: "0 4px 16px rgba(0,0,0,0.4)"
                # Titel + Artist + Playback-Buttons
                - component: f7-col
                  config:
                    style:
                      flex: "1 1 auto"
                      overflow: hidden
                      display: flex
                      flexDirection: column
                      gap: 4px
                  slots:
                    default:
                      - component: oh-label
                        config:
                          item: "=props.titleItem"
                          style:
                            fontWeight: "700"
                            fontSize: 16px
                            display: block
                            whiteSpace: nowrap
                            overflow: hidden
                            textOverflow: ellipsis
                      - component: oh-label
                        config:
                          item: "=props.artistItem"
                          style:
                            color: "#ff5500"
                            fontSize: 14px
                            display: block
                      # Play / Pause / Stop / Mute
                      - component: f7-row
                        config:
                          style:
                            gap: 8px
                            marginTop: 12px
                            justifyContent: flex-start
                        slots:
                          default:
                            # Play → sendet Stream-URL direkt an ausgewähltes Chromecast
                            - component: oh-button
                              config:
                                iconF7: play_fill
                                iconSize: 32
                                style:
                                  color: green
                                action: command
                                actionItem: "=@@props.chromecastTargetItem"
                                actionCommand: "=@@props.streamUrlItem"
                            # Pause → SC_CC_Control (Routing-Regel leitet weiter)
                            - component: oh-button
                              config:
                                iconF7: pause_fill
                                iconSize: 32
                                style:
                                  color: orange
                                action: command
                                actionItem: SC_CC_Control
                                actionCommand: PAUSE
                            # Stop → SC_CC_Stop (Routing-Regel leitet weiter)
                            - component: oh-button
                              config:
                                iconF7: stop_fill
                                iconSize: 32
                                style:
                                  color: red
                                action: command
                                actionItem: SC_CC_Stop
                                actionCommand: ON
                            # Mute Toggle → SC_CC_Mute (Routing-Regel leitet weiter)
                            - component: oh-button
                              config:
                                iconF7: "=(items['SC_CC_Mute'].state === 'ON') ? 'speaker_slash_fill' : 'speaker_2_fill'"
                                iconSize: 32
                                style:
                                  color: "=(items['SC_CC_Mute'].state === 'ON') ? '#ff5500' : 'gray'"
                                action: command
                                actionItem: SC_CC_Mute
                                actionCommand: "=(items['SC_CC_Mute'].state === 'ON') ? 'OFF' : 'ON'"
                      # Volume Slider → SC_CC_Volume (Sync-Regel hält Wert aktuell)
                      - component: f7-row
                        config:
                          style:
                            alignItems: center
                            gap: 8px
                            marginTop: 12px
                        slots:
                          default:
                            - component: f7-icon
                              config:
                                f7: speaker_fill
                                size: 18
                                color: gray
                            - component: oh-slider
                              config:
                                item: SC_CC_Volume
                                min: 0
                                max: 100
                                step: 5
                                style:
                                  flex: "1"
                            - component: f7-icon
                              config:
                                f7: speaker_3_fill
                                size: 18
                                color: gray

    # ── Chromecast Chips ──────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 10px 16px 14px 16px
          borderTop: "1px solid #eee"
      slots:
        default:
          - component: f7-block-title
            config:
              style:
                color: "#888"
                fontSize: 11px
                textTransform: uppercase
                letterSpacing: "0.8px"
                margin: "0 0 8px 0"
              text: "▶ Abspielen auf"
          - component: f7-row
            config:
              style:
                flexWrap: wrap
                gap: 8px
            slots:
              default:
                - component: oh-repeater
                  config:
                    for: cc
                    fragment: true
                    sourceType: itemsWithTags
                    itemTags: "=props.chromecastTag || 'Chromecast'"
                  slots:
                    default:
                      - component: oh-list-item
                        config:
                          title: "=loop.cc.label"
                          action: command
                          actionItem: "=props.chromecastTargetItem"
                          actionCommand: "=loop.cc.name"
                          style:
                            fontWeight: "=(@@props.chromecastTargetItem === loop.cc.name) ? '700' : '400'"
                            color: "=(@@props.chromecastTargetItem === loop.cc.name) ? '#ff5500' : 'inherit'"
                        slots:
                          after:
                            - component: oh-icon
                              config:
                                icon: "=(@@props.chromecastTargetItem === loop.cc.name) ? 'iconify:mdi:cast-connected' : 'iconify:mdi:cast'"
                                color: "=(@@props.chromecastTargetItem === loop.cc.name) ? '#ff5500' : '#aaa'"
                                width: 24px
                                height: 24px
