uid: soundcloud_search
tags:
  - soundcloud
  - music
props:
  parameters:
    - name: queryItem
      label: Search Query Item
      description: String Item linked to soundcloud:account:...:search#query
      type: TEXT
      required: true
      context: item
    - name: resultsItem
      label: Search Results Item
      description: String Item linked to soundcloud:account:...:search#results
      type: TEXT
      required: true
      context: item
    - name: trackIdItem
      label: Track ID Item
      description: String Item linked to soundcloud:account:...:player#track-id
      type: TEXT
      required: true
      context: item
    - name: titleItem
      label: Title Item
      type: TEXT
      required: false
      context: item
    - name: artistItem
      label: Artist Item
      type: TEXT
      required: false
      context: item
    - name: artworkItem
      label: Artwork URL Item
      type: TEXT
      required: false
      context: item
    - name: stateItem
      label: Playback State Item
      type: TEXT
      required: false
      context: item
timestamp: 2026-05-18T00:00:00Z
component: f7-card
config:
  style:
    margin: 0
slots:
  default:

    # ── Orange Header ────────────────────────────────────────────────────────
    - component: f7-card-header
      config:
        style:
          background: "#ff5500"
          color: white
          fontWeight: "700"
          fontSize: 18px
          padding: 12px 16px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: center
                gap: 10px
            slots:
              default:
                - component: f7-icon
                  config:
                    f7: music_note_2
                    size: 22
                    color: white
                - component: f7-block-title
                  config:
                    style:
                      color: white
                      fontSize: 18px
                      margin: 0
                    text: SoundCloud

    # ── Suchfeld + Button ────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 12px 16px 8px 16px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: center
                gap: 8px
            slots:
              default:
                - component: f7-col
                  slots:
                    default:
                      - component: oh-input
                        config:
                          item: "=props.queryItem"
                          placeholder: Künstler oder Titel...
                          clearButton: true
                          sendButton: true
                          style:
                            border: "1px solid #ff5500"
                            borderRadius: 20px
                            padding: 6px 14px
                            width: 100%

    # ── Ergebnisse ───────────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 0
      slots:
        default:
          - component: oh-repeater
            config:
              for: track
              sourceType: expression
              expression: >-
                =(items[props.resultsItem] && items[props.resultsItem].state && items[props.resultsItem].state.startsWith('['))
                  ? JSON.parse(items[props.resultsItem].state)
                  : []
            slots:
              default:
                - component: f7-list
                  config:
                    mediaList: true
                    noHairlines: true
                    style:
                      margin: 0
                  slots:
                    default:
                      - component: f7-list-item
                        config:
                          title: "=loop.track.title"
                          subtitle: "=loop.track.artist"
                          after: "=(function(){ var d=loop.track.duration; return Math.floor(d/60)+':'+(d%60<10?'0':'')+(d%60); })()"
                          mediaItem: true
                          link: true
                          action: command
                          actionItem: "=props.trackIdItem"
                          actionCommand: "=String(loop.track.id)"
                        slots:
                          media:
                            - component: oh-image
                              config:
                                url: "=loop.track.artwork"
                                style:
                                  width: 52px
                                  height: 52px
                                  borderRadius: 6px
                                  objectFit: cover

    # ── Aktueller Track + Steuerung ───────────────────────────────────────────
    - component: f7-card-footer
      config:
        style:
          borderTop: "2px solid #ff5500"
          padding: 8px 16px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: center
                gap: 10px
            slots:
              default:
                - component: oh-image
                  config:
                    item: "=props.artworkItem"
                    style:
                      width: 44px
                      height: 44px
                      borderRadius: 4px
                      objectFit: cover
                      flexShrink: "0"
                - component: f7-col
                  slots:
                    default:
                      - component: oh-label
                        config:
                          item: "=props.titleItem"
                          style:
                            fontWeight: "600"
                            fontSize: 13px
                            display: block
                      - component: oh-label
                        config:
                          item: "=props.artistItem"
                          style:
                            color: "#888"
                            fontSize: 12px
                            display: block
                - component: f7-row
                  config:
                    style:
                      gap: 4px
                      marginLeft: auto
                  slots:
                    default:
                      - component: f7-button
                        config:
                          iconF7: play_fill
                          color: green
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: PLAY
                      - component: f7-button
                        config:
                          iconF7: pause_fill
                          color: orange
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: PAUSE
                      - component: f7-button
                        config:
                          iconF7: stop_fill
                          color: red
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: STOP
