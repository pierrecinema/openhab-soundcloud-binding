uid: soundcloud_search
tags:
  - soundcloud
  - music
props:
  parameters:
    - name: queryItem
      label: Search Query Item
      description: String Item linked to soundcloud:account:...:search#query
      type: TEXT
      required: true
      context: item
    - name: resultsItem
      label: Search Results Item
      description: String Item linked to soundcloud:account:...:search#results
      type: TEXT
      required: true
      context: item
    - name: trackIdItem
      label: Track ID Item
      description: String Item linked to soundcloud:account:...:player#track-id
      type: TEXT
      required: true
      context: item
    - name: streamUrlItem
      label: Stream URL Item
      description: String Item linked to soundcloud:account:...:player#stream-url
      type: TEXT
      required: false
      context: item
    - name: titleItem
      label: Title Item
      type: TEXT
      required: false
      context: item
    - name: artistItem
      label: Artist Item
      type: TEXT
      required: false
      context: item
    - name: artworkItem
      label: Artwork URL Item
      type: TEXT
      required: false
      context: item
    - name: stateItem
      label: Playback State Item
      type: TEXT
      required: false
      context: item
    - name: chromecastGroupItem
      label: Chromecast Group Item
      description: Group Item containing all Chromecast playuri items (one per Chromecast)
      type: TEXT
      required: false
      context: item
timestamp: 2026-05-19T00:00:00Z
component: f7-card
config:
  style:
    margin: 0
slots:
  default:

    # ── Orange Header ────────────────────────────────────────────────────────
    - component: f7-card-header
      config:
        style:
          background: "#ff5500"
          color: white
          fontWeight: "700"
          fontSize: 18px
          padding: 12px 16px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: center
                gap: 10px
            slots:
              default:
                - component: f7-icon
                  config:
                    f7: music_note_2
                    size: 22
                    color: white
                - component: f7-block-title
                  config:
                    style:
                      color: white
                      fontSize: 18px
                      margin: 0
                    text: SoundCloud

    # ── Suchfeld ─────────────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 12px 16px 8px 16px
      slots:
        default:
          - component: oh-input
            config:
              item: "=props.queryItem"
              placeholder: Künstler oder Titel...
              clearButton: true
              sendButton: true
              style:
                border: "1px solid #ff5500"
                borderRadius: 20px
                padding: 6px 14px
                width: 100%

    # ── Suchergebnisse ────────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 0
          minHeight: 300px
          maxHeight: 420px
          overflowY: auto
      slots:
        default:
          - component: f7-list
            config:
              noHairlines: true
              style:
                margin: 0
            slots:
              default:
                - component: oh-repeater
                  config:
                    for: track
                    fragment: true
                    sourceType: array
                    in: "=(@@props.resultsItem || '').startsWith('[') ? JSON.parse(@@props.resultsItem) : []"
                  slots:
                    default:
                      - component: oh-list-item
                        config:
                          title: "=loop.track.title"
                          subtitle: "=loop.track.artist"
                          action: command
                          actionItem: "=props.trackIdItem"
                          actionCommand: "=loop.track.id"

    # ── Aktueller Track ───────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          borderTop: "2px solid #ff5500"
          padding: 12px 16px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: flex-start
                gap: 16px
            slots:
              default:
                # Cover-Art
                - component: f7-col
                  config:
                    style:
                      flex: "0 0 auto"
                  slots:
                    default:
                      - component: oh-image
                        config:
                          item: "=props.artworkItem"
                          style:
                            display: block
                            width: 320px
                            height: 320px
                            minWidth: 320px
                            minHeight: 320px
                            borderRadius: 12px
                            objectFit: cover
                            boxShadow: "0 4px 16px rgba(0,0,0,0.4)"
                # Titel + Artist + Buttons
                - component: f7-col
                  config:
                    style:
                      flex: "1 1 auto"
                      overflow: hidden
                      display: flex
                      flexDirection: column
                      gap: 4px
                  slots:
                    default:
                      - component: oh-label
                        config:
                          item: "=props.titleItem"
                          style:
                            fontWeight: "700"
                            fontSize: 16px
                            display: block
                            whiteSpace: nowrap
                            overflow: hidden
                            textOverflow: ellipsis
                      - component: oh-label
                        config:
                          item: "=props.artistItem"
                          style:
                            color: "#ff5500"
                            fontSize: 14px
                            display: block
                      - component: f7-row
                        config:
                          style:
                            gap: 8px
                            marginTop: 12px
                        slots:
                          default:
                            - component: f7-button
                              config:
                                iconF7: play_fill
                                iconSize: 32
                                color: green
                                action: command
                                actionItem: "=props.stateItem"
                                actionCommand: PLAY
                            - component: f7-button
                              config:
                                iconF7: pause_fill
                                iconSize: 32
                                color: orange
                                action: command
                                actionItem: "=props.stateItem"
                                actionCommand: PAUSE
                            - component: f7-button
                              config:
                                iconF7: stop_fill
                                iconSize: 32
                                color: red
                                action: command
                                actionItem: "=props.stateItem"
                                actionCommand: STOP

    # ── Chromecast Auswahl ────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 8px 16px 12px 16px
          borderTop: "1px solid #eee"
      slots:
        default:
          - component: f7-block-title
            config:
              style:
                color: "#888"
                fontSize: 12px
                textTransform: uppercase
                letterSpacing: "0.5px"
                marginBottom: 4px
              text: Abspielen auf
          - component: f7-list
            config:
              noHairlines: true
              style:
                margin: 0
            slots:
              default:
                - component: oh-repeater
                  config:
                    for: cc
                    fragment: true
                    sourceType: itemsInGroup
                    groupItem: "=props.chromecastGroupItem"
                  slots:
                    default:
                      - component: oh-list-item
                        config:
                          title: "=loop.cc.label"
                          action: command
                          actionItem: "=loop.cc.name"
                          actionCommand: "=@@props.streamUrlItem"
                        slots:
                          after:
                            - component: f7-icon
                              config:
                                f7: airplayvideo
                                size: 20
                                color: "=#ff5500"
