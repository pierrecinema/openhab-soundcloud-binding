uid: soundcloud_search
tags:
  - soundcloud
  - music
props:
  parameters:
    - name: queryItem
      label: Search Query Item
      description: String Item linked to soundcloud:account:...:search#query
      type: TEXT
      required: true
      context: item
    - name: resultsItem
      label: Search Results Item
      description: String Item linked to soundcloud:account:...:search#results
      type: TEXT
      required: true
      context: item
    - name: trackIdItem
      label: Track ID Item
      description: String Item linked to soundcloud:account:...:player#track-id
      type: TEXT
      required: true
      context: item
    - name: titleItem
      label: Title Item
      description: String Item linked to soundcloud:account:...:player#title
      type: TEXT
      required: false
      context: item
    - name: artistItem
      label: Artist Item
      description: String Item linked to soundcloud:account:...:player#artist
      type: TEXT
      required: false
      context: item
    - name: artworkItem
      label: Artwork URL Item
      description: String Item linked to soundcloud:account:...:player#artwork-url
      type: TEXT
      required: false
      context: item
    - name: stateItem
      label: Playback State Item
      description: String Item linked to soundcloud:account:...:player#playback-state
      type: TEXT
      required: false
      context: item
timestamp: 2026-05-18T00:00:00Z
component: f7-card
config: {}
slots:
  default:
    # ── Search input ──────────────────────────────────────────────────────────
    - component: f7-card-header
      config:
        style:
          background: "#ff5500"
          padding: 8px 12px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: center
                gap: 8px
            slots:
              default:
                - component: f7-col
                  slots:
                    default:
                      - component: f7-list
                        config:
                          inset: false
                          style:
                            margin: 0
                        slots:
                          default:
                            - component: f7-list-input
                              config:
                                type: text
                                placeholder: Künstler oder Titel suchen...
                                clearButton: true
                                variable: scQuery
                                style:
                                  "--f7-input-text-color": white
                                  "--f7-input-placeholder-color": "rgba(255,255,255,0.6)"
                - component: f7-button
                  config:
                    iconF7: search
                    style:
                      color: white
                      flexShrink: "0"
                    action: command
                    actionItem: "=props.queryItem"
                    actionCommand: "=vars.scQuery"

    # ── Results list ──────────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 0
          minHeight: 60px
      slots:
        default:
          - component: oh-repeater
            config:
              for: track
              sourceType: expression
              expression: >-
                =(function(){
                  var ri = props.resultsItem;
                  try {
                    var s = items[ri] ? items[ri].state : null;
                    if (!s || s === '-' || !s.startsWith('[')) return [];
                    return JSON.parse(s);
                  } catch(e) { return []; }
                })()
            slots:
              default:
                - component: f7-list
                  config:
                    mediaList: true
                    style:
                      margin: 0
                  slots:
                    default:
                      - component: f7-list-item
                        config:
                          title: "=loop.track.title"
                          subtitle: "=loop.track.artist"
                          after: "=(function(){ var d=loop.track.duration; return Math.floor(d/60)+':'+(d%60<10?'0':'')+(d%60); })()"
                          mediaItem: true
                          action: command
                          actionItem: "=props.trackIdItem"
                          actionCommand: "=String(loop.track.id)"
                        slots:
                          media:
                            - component: oh-image
                              config:
                                url: "=loop.track.artwork"
                                style:
                                  width: 52px
                                  height: 52px
                                  borderRadius: 6px
                                  objectFit: cover

    # ── Now playing ───────────────────────────────────────────────────────────
    - component: f7-card-footer
      config:
        style:
          padding: 8px 12px
          borderTop: "1px solid var(--f7-card-border-color)"
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: center
                gap: 10px
            slots:
              default:
                - component: oh-image
                  config:
                    item: "=props.artworkItem"
                    style:
                      width: 44px
                      height: 44px
                      borderRadius: 4px
                      objectFit: cover
                      flexShrink: "0"
                - component: f7-col
                  slots:
                    default:
                      - component: oh-label
                        config:
                          item: "=props.titleItem"
                          style:
                            fontWeight: "600"
                            fontSize: 13px
                            display: block
                      - component: oh-label
                        config:
                          item: "=props.artistItem"
                          style:
                            color: var(--f7-list-item-footer-text-color)
                            fontSize: 12px
                            display: block
                - component: f7-row
                  config:
                    style:
                      gap: 4px
                      marginLeft: auto
                      flexShrink: "0"
                  slots:
                    default:
                      - component: f7-button
                        config:
                          iconF7: play_fill
                          color: green
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: PLAY
                      - component: f7-button
                        config:
                          iconF7: pause_fill
                          color: orange
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: PAUSE
                      - component: f7-button
                        config:
                          iconF7: stop_fill
                          color: red
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: STOP
