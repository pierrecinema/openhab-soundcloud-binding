uid: soundcloud_search
tags:
  - soundcloud
  - music
props:
  parameters:
    - name: queryItem
      label: Search Query Item
      description: String Item linked to soundcloud:account:...:search#query
      type: TEXT
      required: true
      context: item
    - name: resultsItem
      label: Search Results Item
      description: String Item linked to soundcloud:account:...:search#results
      type: TEXT
      required: true
      context: item
    - name: trackIdItem
      label: Track ID Item
      description: String Item linked to soundcloud:account:...:player#track-id
      type: TEXT
      required: true
      context: item
    - name: titleItem
      label: Title Item
      type: TEXT
      required: false
      context: item
    - name: artistItem
      label: Artist Item
      type: TEXT
      required: false
      context: item
    - name: artworkItem
      label: Artwork URL Item
      type: TEXT
      required: false
      context: item
    - name: stateItem
      label: Playback State Item
      type: TEXT
      required: false
      context: item
timestamp: 2026-05-18T00:00:00Z
component: f7-card
config:
  style:
    margin: 0
slots:
  default:

    # ── Orange Header ────────────────────────────────────────────────────────
    - component: f7-card-header
      config:
        style:
          background: "#ff5500"
          color: white
          fontWeight: "700"
          fontSize: 18px
          padding: 12px 16px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: center
                gap: 10px
            slots:
              default:
                - component: f7-icon
                  config:
                    f7: music_note_2
                    size: 22
                    color: white
                - component: f7-block-title
                  config:
                    style:
                      color: white
                      fontSize: 18px
                      margin: 0
                    text: SoundCloud

    # ── Suchfeld + Button ────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 12px 16px 8px 16px
      slots:
        default:
          - component: f7-row
            config:
              style:
                alignItems: center
                gap: 8px
            slots:
              default:
                - component: f7-col
                  slots:
                    default:
                      - component: oh-input
                        config:
                          item: "=props.queryItem"
                          placeholder: Künstler oder Titel...
                          clearButton: true
                          sendButton: true
                          style:
                            border: "1px solid #ff5500"
                            borderRadius: 20px
                            padding: 6px 14px
                            width: 100%

    # ── Ergebnisse ───────────────────────────────────────────────────────────
    - component: f7-card-content
      config:
        style:
          padding: 0
          minHeight: 300px
          maxHeight: 420px
          overflowY: auto
      slots:
        default:
          - component: f7-list
            config:
              noHairlines: true
              style:
                margin: 0
            slots:
              default:
                - component: oh-repeater
                  config:
                    for: track
                    fragment: true
                    sourceType: array
                    in: "=(@@props.resultsItem || '').startsWith('[') ? JSON.parse(@@props.resultsItem) : []"
                  slots:
                    default:
                      - component: oh-list-item
                        config:
                          title: "=loop.track.title"
                          subtitle: "=loop.track.artist"
                          action: command
                          actionItem: "=props.trackIdItem"
                          actionCommand: "=loop.track.id"

    # ── Aktueller Track + Steuerung ───────────────────────────────────────────
    - component: f7-card-footer
      config:
        style:
          borderTop: "2px solid #ff5500"
          padding: 12px 16px
      slots:
        default:
          - component: f7-col
            config:
              style:
                alignItems: center
                display: flex
                flexDirection: column
                gap: 10px
            slots:
              default:
                - component: oh-image
                  config:
                    item: "=props.artworkItem"
                    style:
                      width: 320px
                      height: 320px
                      borderRadius: 12px
                      objectFit: cover
                      boxShadow: "0 4px 16px rgba(0,0,0,0.4)"
                      alignSelf: center
                - component: f7-col
                  config:
                    style:
                      width: 100%
                      overflow: hidden
                  slots:
                    default:
                      - component: oh-label
                        config:
                          item: "=props.titleItem"
                          style:
                            fontWeight: "700"
                            fontSize: 15px
                            display: block
                            whiteSpace: nowrap
                            overflow: hidden
                            textOverflow: ellipsis
                      - component: oh-label
                        config:
                          item: "=props.artistItem"
                          style:
                            color: "#ff5500"
                            fontSize: 13px
                            display: block
                            marginTop: 2px
                - component: f7-row
                  config:
                    style:
                      gap: 12px
                      justifyContent: center
                      width: 100%
                  slots:
                    default:
                      - component: f7-button
                        config:
                          iconF7: play_fill
                          iconSize: 28
                          color: green
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: PLAY
                      - component: f7-button
                        config:
                          iconF7: pause_fill
                          iconSize: 28
                          color: orange
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: PAUSE
                      - component: f7-button
                        config:
                          iconF7: stop_fill
                          iconSize: 28
                          color: red
                          action: command
                          actionItem: "=props.stateItem"
                          actionCommand: STOP
