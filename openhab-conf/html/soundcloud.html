<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #121212; color: #fff; }

    header { background: #ff5500; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; font-weight: 700; }

    .search-bar { padding: 16px 20px; background: #1a1a1a; display: flex; gap: 10px; }
    .search-bar input {
      flex: 1; padding: 10px 16px; border-radius: 24px;
      border: none; background: #333; color: #fff; font-size: 15px; outline: none;
    }
    .search-bar input::placeholder { color: #888; }
    .search-bar button {
      padding: 10px 20px; border-radius: 24px; border: none;
      background: #ff5500; color: #fff; font-size: 15px; cursor: pointer; font-weight: 600;
    }
    .search-bar button:hover { background: #e04400; }

    #results { padding: 12px 0; }

    .track {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 20px; cursor: pointer; transition: background 0.15s;
    }
    .track:hover { background: #1e1e1e; }
    .track.playing { background: #1a2a1a; border-left: 3px solid #ff5500; }

    .track img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: #333; flex-shrink: 0; }
    .track-info { flex: 1; min-width: 0; }
    .track-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 13px; color: #aaa; margin-top: 2px; }
    .track-duration { font-size: 12px; color: #666; white-space: nowrap; }
    .play-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: #ff5500; color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .play-btn:hover { background: #e04400; transform: scale(1.1); }

    #now-playing {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1a1a1a; border-top: 1px solid #333;
      padding: 12px 20px; display: flex; align-items: center; gap: 14px;
    }
    #now-playing img { width: 44px; height: 44px; border-radius: 4px; background: #333; }
    #now-playing .info { flex: 1; min-width: 0; }
    #now-playing .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #now-playing .artist { font-size: 12px; color: #aaa; }
    .controls { display: flex; gap: 8px; }
    .ctrl-btn {
      padding: 8px 14px; border-radius: 20px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600;
    }
    .ctrl-btn.play  { background: #ff5500; color: #fff; }
    .ctrl-btn.pause { background: #ff9500; color: #fff; }
    .ctrl-btn.stop  { background: #333; color: #fff; }

    #status { text-align: center; padding: 40px; color: #555; font-size: 14px; }
    #loading { text-align: center; padding: 40px; color: #ff5500; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M1.175 12.225c-.15 0-.25.1-.25.25l-.325 2.025.325 2.025c0 .15.1.25.25.25s.25-.1.25-.25l.375-2.025-.375-2.025c0-.15-.1-.25-.25-.25zm1.65-.575c-.175 0-.3.125-.3.3L2.2 14.5l.325 2.55c0 .175.125.3.3.3s.3-.125.3-.3l.375-2.55-.375-2.55c0-.175-.125-.3-.3-.3zm1.7-.325c-.2 0-.35.15-.35.35l-.3 2.825.3 2.825c0 .2.15.35.35.35s.35-.15.35-.35l.35-2.825-.35-2.825c0-.2-.15-.35-.35-.35zM12 6c-2.8 0-5.175 1.7-6.3 4.175-.35-.15-.75-.225-1.15-.225-1.675 0-3.025 1.375-3.025 3.05S2.875 16.05 4.55 16.05H12c2.8 0 5.075-2.25 5.075-5.025S14.8 6 12 6z"/></svg>
  <h1>SoundCloud</h1>
</header>

<div class="search-bar">
  <input type="text" id="query" placeholder="Künstler oder Titel suchen..." />
  <button onclick="search()">Suchen</button>
</div>

<div id="results">
  <div id="status">Suchbegriff eingeben und Suchen drücken</div>
</div>

<div id="now-playing" style="display:none">
  <img id="np-cover" src="" alt="">
  <div class="info">
    <div class="title" id="np-title">—</div>
    <div class="artist" id="np-artist">—</div>
  </div>
  <div class="controls">
    <button class="ctrl-btn play"  onclick="sendCommand('SC_State','PLAY')">▶</button>
    <button class="ctrl-btn pause" onclick="sendCommand('SC_State','PAUSE')">⏸</button>
    <button class="ctrl-btn stop"  onclick="sendCommand('SC_State','STOP')">⏹</button>
  </div>
</div>

<script>
  const OH = 'http://192.168.1.201:7070';
  let currentId = null;

  document.getElementById('query').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

  async function search() {
    const q = document.getElementById('query').value.trim();
    if (!q) return;
    document.getElementById('results').innerHTML = '<div id="loading">Suche läuft...</div>';
    await sendCommand('SC_Query', q);
    // Wait for results to arrive
    let attempts = 0;
    const poll = setInterval(async () => {
      attempts++;
      const val = await getItem('SC_Results');
      if (val && val.startsWith('[') && val.includes(q.split(' ')[0])) {
        clearInterval(poll);
        renderResults(val);
      } else if (attempts > 20) {
        clearInterval(poll);
        document.getElementById('results').innerHTML = '<div id="status">Keine Ergebnisse</div>';
      }
    }, 500);
  }

  function renderResults(json) {
    let tracks;
    try { tracks = JSON.parse(json); } catch(e) { return; }
    if (!tracks.length) {
      document.getElementById('results').innerHTML = '<div id="status">Keine Ergebnisse gefunden</div>';
      return;
    }
    const html = tracks.map(t => `
      <div class="track ${t.id == currentId ? 'playing' : ''}" onclick="playTrack(${t.id}, '${esc(t.title)}', '${esc(t.artist)}', '${esc(t.artwork)}')">
        <img src="${t.artwork || ''}" onerror="this.src=''" alt="">
        <div class="track-info">
          <div class="track-title">${esc(t.title)}</div>
          <div class="track-artist">${esc(t.artist)}</div>
        </div>
        <div class="track-duration">${fmt(t.duration)}</div>
        <button class="play-btn" onclick="event.stopPropagation();playTrack(${t.id},'${esc(t.title)}','${esc(t.artist)}','${esc(t.artwork)}')">▶</button>
      </div>
    `).join('');
    document.getElementById('results').innerHTML = html;
  }

  async function playTrack(id, title, artist, artwork) {
    currentId = id;
    await sendCommand('SC_TrackID', String(id));
    document.getElementById('now-playing').style.display = 'flex';
    document.getElementById('np-title').textContent  = title  || '—';
    document.getElementById('np-artist').textContent = artist || '—';
    document.getElementById('np-cover').src = artwork || '';
    // Highlight playing track
    document.querySelectorAll('.track').forEach(el => el.classList.remove('playing'));
    document.querySelectorAll('.track').forEach(el => {
      if (el.querySelector('.track-title') && el.querySelector('.track-title').textContent === title)
        el.classList.add('playing');
    });
  }

  async function sendCommand(item, cmd) {
    await fetch(`${OH}/rest/items/${item}`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: cmd
    });
  }

  async function getItem(item) {
    const r = await fetch(`${OH}/rest/items/${item}/state`);
    return r.ok ? r.text() : null;
  }

  function fmt(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  function esc(s) {
    return (s || '').replace(/'/g, "\\'").replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>

</body>
</html>
